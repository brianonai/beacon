# Host ports below avoid Windows Hyper-V excluded ranges that often block :8000
# ("forbidden by its access permissions"). Change the left side if these are taken.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      ALLOWED_ORIGIN: http://localhost:13000
      OAUTH_REDIRECT_URI: http://localhost:18080/auth/google/callback
      POST_LOGIN_REDIRECT: http://localhost:13000/
      # oauthlib blocks http:// OAuth redirects unless this is set (localhost dev only).
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    ports:
      - "18080:8000"
    restart: unless-stopped
    # Healthcheck is also defined in the image; this mirrors it for compose.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the build so rewrites() resolves correctly
        # regardless of when Next evaluates them.
        API_TARGET: http://api:8000
    environment:
      # Belt-and-suspenders: also available at runtime.
      API_TARGET: http://api:8000
    ports:
      - "13000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
